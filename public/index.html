<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ec">
  <title>同词相遇 · 联机版</title>
  <style>
    :root {
      --ink: #17201c;
      --muted: #65716b;
      --paper: #f4f2ec;
      --panel: #fff;
      --line: #d5dbd7;
      --green: #18734c;
      --green-dark: #105a3a;
      --yellow: #f0c44f;
      --red: #c54e43;
      --shadow: 0 18px 50px rgba(30, 47, 39, .11);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .shell {
      width: min(620px, calc(100% - 28px));
      margin: 0 auto;
      padding: max(22px, env(safe-area-inset-top)) 0 max(30px, env(safe-area-inset-bottom));
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .mark {
      position: relative;
      width: 48px;
      height: 48px;
      flex: none;
    }

    .mark::before, .mark::after {
      position: absolute;
      width: 31px;
      height: 31px;
      border: 3px solid var(--ink);
      content: "";
    }

    .mark::before { top: 2px; left: 1px; background: var(--yellow); }
    .mark::after { right: 1px; bottom: 2px; background: var(--green); mix-blend-mode: multiply; }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1;
      letter-spacing: 0;
    }

    .tagline { margin: 7px 0 0; color: var(--muted); font-size: 13px; }

    .screen { display: none; }
    .screen.active { display: block; }

    .hero {
      padding: 36px 0 26px;
      text-align: center;
    }

    .tiles {
      position: relative;
      width: 142px;
      height: 100px;
      margin: 0 auto 28px;
    }

    .tile {
      position: absolute;
      display: grid;
      width: 94px;
      height: 68px;
      place-items: center;
      border: 3px solid var(--ink);
      background: var(--yellow);
      font-size: 28px;
      font-weight: 900;
      box-shadow: 6px 6px 0 var(--ink);
    }

    .tile:first-child { left: 0; top: 0; transform: rotate(-5deg); }
    .tile:last-child { right: 0; bottom: 0; background: #5baa82; transform: rotate(5deg); }

    .hero h2 { margin: 0; font-size: 42px; letter-spacing: 0; }
    .hero p { margin: 15px auto 0; max-width: 420px; color: var(--muted); line-height: 1.75; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 22px;
    }

    .button {
      min-height: 52px;
      padding: 0 18px;
      border: 1px solid var(--ink);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      font-weight: 800;
    }

    .button.primary {
      border-color: var(--green);
      background: var(--green);
      color: white;
    }

    .button.primary:hover { background: var(--green-dark); }
    .button:disabled { cursor: default; opacity: .55; }

    .join-box {
      display: none;
      margin-top: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .join-box.open { display: block; }

    .room-input, .word-input {
      width: 100%;
      border: 2px solid var(--line);
      border-radius: 6px;
      outline: 0;
      background: #fbfcfb;
      color: var(--ink);
      text-align: center;
      text-transform: uppercase;
    }

    .room-input {
      height: 58px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 4px;
    }

    .room-input:focus, .word-input:focus { border-color: var(--green); background: white; }
    .join-box .button { width: 100%; margin-top: 10px; }

    .room-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .room-label { color: var(--muted); font-size: 12px; }

    .room-code {
      display: block;
      margin-top: 3px;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .copy-button {
      min-height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      font-weight: 750;
    }

    .waiting {
      padding: 52px 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: center;
      box-shadow: var(--shadow);
    }

    .pulse {
      width: 52px;
      height: 52px;
      margin: 0 auto 20px;
      border: 8px solid #dce5e0;
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .waiting h2 { margin: 0; font-size: 24px; }
    .waiting p { margin: 10px 0 0; color: var(--muted); line-height: 1.65; }

    .status-grid {
      display: grid;
      grid-template-columns: 1fr 126px 1fr;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat { padding: 12px 4px; border-block: 1px solid var(--line); }
    .stat:last-child { text-align: right; }
    .stat span { color: var(--muted); font-size: 12px; }
    .stat strong { display: block; margin-top: 4px; font-size: 19px; }

    .timer {
      display: grid;
      width: 116px;
      height: 116px;
      margin: auto;
      place-items: center;
      border: 8px solid #dce2de;
      border-radius: 50%;
      font-size: 36px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .timer.urgent { border-color: var(--red); color: var(--red); }

    .game-panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .player-row h2 { margin: 0; font-size: 21px; }

    .connection {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .connection::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      content: "";
    }

    .connection.offline::before { background: var(--red); }

    .word-input {
      height: 70px;
      padding: 0 15px;
      font-size: 25px;
      font-weight: 800;
      text-transform: none;
      letter-spacing: 0;
    }

    .game-panel .button { width: 100%; margin-top: 12px; }

    .submission-status {
      min-height: 22px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .result {
      margin-top: 16px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      text-align: center;
    }

    .result.success { border-color: var(--green); background: #edf7f1; }
    .result.fail { border-color: #dfbbb6; background: #fff3f1; }
    .result h3 { margin: 0; font-size: 22px; }
    .result p { margin: 8px 0 0; color: var(--muted); line-height: 1.6; }

    .history {
      margin-top: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .history-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .history-heading h3 { margin: 0; font-size: 18px; }
    .history-heading span { color: var(--muted); font-size: 12px; }

    .history-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .history-empty {
      padding: 14px 0;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .history-item {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) 24px minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fafbf9;
    }

    .history-item.matched {
      border-color: var(--green);
      background: #edf7f1;
    }

    .history-round { color: var(--muted); font-size: 12px; }
    .history-word { min-width: 0; overflow-wrap: anywhere; font-weight: 800; }
    .history-divider { color: var(--muted); text-align: center; }

    .error {
      min-height: 24px;
      margin: 12px 0 0;
      color: var(--red);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 460px) {
      .shell { width: min(100% - 20px, 620px); }
      .brand { margin-bottom: 16px; }
      .hero { padding-top: 20px; }
      .hero h2 { font-size: 36px; }
      .actions { grid-template-columns: 1fr; }
      .status-grid { grid-template-columns: 1fr 104px 1fr; gap: 5px; }
      .timer { width: 98px; height: 98px; font-size: 31px; }
      .game-panel { padding: 18px; }
      .room-code { font-size: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div>
        <h1>同词相遇</h1>
        <p class="tagline">双人互联网联机版</p>
      </div>
    </header>

    <section class="screen active" id="homeScreen">
      <div class="hero">
        <div class="tiles" aria-hidden="true">
          <div class="tile">词</div>
          <div class="tile">词</div>
        </div>
        <h2>想到一起了吗？</h2>
        <p>创建一个房间，把邀请链接发给朋友。你们可以在不同地点，用两部手机同时游玩。</p>
      </div>
      <div class="actions">
        <button class="button primary" id="createButton" type="button">创建房间</button>
        <button class="button" id="showJoinButton" type="button">加入房间</button>
      </div>
      <div class="join-box" id="joinBox">
        <input class="room-input" id="roomInput" maxlength="6" autocomplete="off" inputmode="text" placeholder="输入房间码" aria-label="房间码">
        <button class="button primary" id="joinButton" type="button">进入房间</button>
      </div>
      <p class="error" id="homeError" aria-live="polite"></p>
    </section>

    <section class="screen" id="roomScreen">
      <div class="room-top">
        <div>
          <span class="room-label">房间码</span>
          <strong class="room-code" id="roomCode">------</strong>
        </div>
        <button class="copy-button" id="copyButton" type="button">复制邀请链接</button>
      </div>

      <div id="waitingView" class="waiting">
        <div class="pulse" aria-hidden="true"></div>
        <h2>等待另一位玩家</h2>
        <p>把邀请链接发给朋友。对方进入后，第一轮会自动开始。</p>
      </div>

      <div id="gameView" hidden>
        <div class="status-grid">
          <div class="stat">
            <span>当前轮次</span>
            <strong>第 <b id="roundNumber">1</b> 轮</strong>
          </div>
          <div class="timer" id="timer">30</div>
          <div class="stat">
            <span>已完成</span>
            <strong><b id="completedNumber">0</b> 轮</strong>
          </div>
        </div>

        <div class="game-panel">
          <div class="player-row">
            <h2 id="playerTitle">你是玩家一</h2>
            <span class="connection" id="connectionStatus">对方在线</span>
          </div>
          <input class="word-input" id="wordInput" maxlength="12" autocomplete="off" placeholder="输入一个词" aria-label="你的词">
          <button class="button primary" id="submitButton" type="button">确认这个词</button>
          <p class="submission-status" id="submissionStatus">提交后不可修改，对方看不到你的答案</p>
        </div>

        <div class="result" id="resultBox">
          <h3 id="resultTitle">写下此刻想到的一个词</h3>
          <p id="resultDetail">看看你们会不会想到一起</p>
        </div>

        <section class="history" aria-labelledby="historyTitle">
          <div class="history-heading">
            <h3 id="historyTitle">对局记录</h3>
            <span>玩家一 / 玩家二</span>
          </div>
          <ol class="history-list" id="historyList">
            <li class="history-empty">完成第一轮后，这里会显示双方的词</li>
          </ol>
        </section>
      </div>
      <p class="error" id="roomError" aria-live="polite"></p>
    </section>
  </main>

  <script>
    const state = {
      roomCode: "",
      playerId: "",
      source: null,
      server: null,
      timerId: null
    };

    const el = Object.fromEntries(
      [...document.querySelectorAll("[id]")].map((node) => [node.id, node])
    );

    function showScreen(name) {
      el.homeScreen.classList.toggle("active", name === "home");
      el.roomScreen.classList.toggle("active", name === "room");
    }

    function setError(target, message = "") {
      target.textContent = message;
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: { "Content-Type": "application/json", ...(options.headers || {}) }
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.error || "网络请求失败");
      return body;
    }

    function saveSession() {
      sessionStorage.setItem("tongci-session", JSON.stringify({
        roomCode: state.roomCode,
        playerId: state.playerId
      }));
    }

    function enterRoom(roomCode, playerId) {
      state.roomCode = roomCode;
      state.playerId = playerId;
      saveSession();
      el.roomCode.textContent = roomCode;
      showScreen("room");
      connect();
      history.replaceState(null, "", `/?room=${encodeURIComponent(roomCode)}`);
    }

    function connect() {
      state.source?.close();
      const query = new URLSearchParams({ room: state.roomCode, player: state.playerId });
      state.source = new EventSource(`/events?${query}`);
      state.source.addEventListener("state", (event) => {
        state.server = JSON.parse(event.data);
        render();
      });
      state.source.onerror = () => {
        el.connectionStatus.textContent = "正在重连";
        el.connectionStatus.classList.add("offline");
      };
    }

    function render() {
      const server = state.server;
      if (!server) return;
      const waiting = server.playerCount < 2 || server.phase === "waiting";
      el.waitingView.hidden = !waiting;
      el.gameView.hidden = waiting;
      el.playerTitle.textContent = `你是玩家${server.playerNumber === 1 ? "一" : "二"}`;
      el.roundNumber.textContent = server.round;
      el.completedNumber.textContent = server.history.length;
      el.connectionStatus.textContent = server.opponentConnected ? "对方在线" : "对方离线";
      el.connectionStatus.classList.toggle("offline", !server.opponentConnected);

      const canSubmit = server.phase === "playing" && !server.submitted;
      el.wordInput.disabled = !canSubmit;
      el.submitButton.disabled = !canSubmit;
      el.submitButton.textContent = server.submitted ? "本轮已提交" : "确认这个词";

      if (server.phase === "playing") {
        el.resultBox.className = "result";
        el.resultTitle.textContent = "写下此刻想到的一个词";
        el.resultDetail.textContent = "看看你们会不会想到一起";
        if (server.submitted) {
          el.submissionStatus.textContent = server.opponentSubmitted
            ? "双方已提交，正在揭晓"
            : "已锁定答案，等待对方提交";
        } else if (server.opponentSubmitted) {
          el.submissionStatus.textContent = "对方已经提交，轮到你了";
        } else {
          el.submissionStatus.textContent = "提交后不可修改，对方看不到你的答案";
        }
      }

      if ((server.phase === "reveal" || server.phase === "finished") && server.result) {
        const result = server.result;
        el.resultBox.className = `result ${result.matched ? "success" : "fail"}`;
        el.resultTitle.textContent = result.matched
          ? "相遇成功，游戏结束！"
          : result.timedOut ? "时间到，下一轮再相遇" : "这次没有遇见";
        const labels = result.words.map((word, index) =>
          `玩家${index === 0 ? "一" : "二"}：${word ? `“${word}”` : "未提交"}`
        );
        el.resultDetail.textContent = labels.join("　");
        el.submissionStatus.textContent = result.matched
          ? `你们在第 ${server.round} 轮成功相遇`
          : "即将自动进入下一轮";
        el.wordInput.value = "";
      }

      renderHistory(server.history);
      updateCountdown();
      clearInterval(state.timerId);
      if (server.phase === "playing") {
        state.timerId = setInterval(updateCountdown, 250);
      }
    }

    function renderHistory(history) {
      el.historyList.replaceChildren();
      if (!history.length) {
        const empty = document.createElement("li");
        empty.className = "history-empty";
        empty.textContent = "完成第一轮后，这里会显示双方的词";
        el.historyList.append(empty);
        return;
      }

      for (const entry of history) {
        const item = document.createElement("li");
        item.className = `history-item${entry.matched ? " matched" : ""}`;

        const round = document.createElement("span");
        round.className = "history-round";
        round.textContent = `第 ${entry.round} 轮`;

        const first = document.createElement("span");
        first.className = "history-word";
        first.textContent = entry.words[0] || "未提交";

        const divider = document.createElement("span");
        divider.className = "history-divider";
        divider.textContent = entry.matched ? "=" : "/";

        const second = document.createElement("span");
        second.className = "history-word";
        second.textContent = entry.words[1] || "未提交";

        item.append(round, first, divider, second);
        el.historyList.append(item);
      }
    }

    function updateCountdown() {
      const deadline = state.server?.deadline;
      const seconds = deadline ? Math.max(0, Math.ceil((deadline - Date.now()) / 1000)) : 0;
      el.timer.textContent = state.server?.phase === "finished" ? "✓" : seconds;
      el.timer.classList.toggle("urgent", seconds <= 5);
    }

    async function createRoom() {
      setError(el.homeError);
      el.createButton.disabled = true;
      try {
        const data = await api("/api/rooms", { method: "POST", body: "{}" });
        enterRoom(data.roomCode, data.playerId);
      } catch (error) {
        setError(el.homeError, error.message);
      } finally {
        el.createButton.disabled = false;
      }
    }

    async function joinRoom(code) {
      const roomCode = String(code || "").trim().toUpperCase();
      if (roomCode.length !== 6) {
        setError(el.homeError, "请输入 6 位房间码");
        return;
      }
      setError(el.homeError);
      el.joinButton.disabled = true;
      try {
        const data = await api(`/api/rooms/${encodeURIComponent(roomCode)}/join`, {
          method: "POST",
          body: "{}"
        });
        enterRoom(data.roomCode, data.playerId);
      } catch (error) {
        setError(el.homeError, error.message);
      } finally {
        el.joinButton.disabled = false;
      }
    }

    async function submitWord() {
      const word = el.wordInput.value.trim();
      if (!word) {
        setError(el.roomError, "请先输入一个词");
        el.wordInput.focus();
        return;
      }
      setError(el.roomError);
      el.submitButton.disabled = true;
      try {
        await api(`/api/rooms/${state.roomCode}/submit`, {
          method: "POST",
          body: JSON.stringify({ playerId: state.playerId, word })
        });
      } catch (error) {
        setError(el.roomError, error.message);
        el.submitButton.disabled = false;
      }
    }

    async function copyInvite() {
      const invite = `${location.origin}/?room=${encodeURIComponent(state.roomCode)}`;
      try {
        await navigator.clipboard.writeText(invite);
        el.copyButton.textContent = "已复制";
      } catch {
        window.prompt("复制这个邀请链接", invite);
      }
      setTimeout(() => { el.copyButton.textContent = "复制邀请链接"; }, 1800);
    }

    el.createButton.addEventListener("click", createRoom);
    el.showJoinButton.addEventListener("click", () => {
      el.joinBox.classList.toggle("open");
      if (el.joinBox.classList.contains("open")) el.roomInput.focus();
    });
    el.joinButton.addEventListener("click", () => joinRoom(el.roomInput.value));
    el.roomInput.addEventListener("input", () => {
      el.roomInput.value = el.roomInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    });
    el.roomInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") joinRoom(el.roomInput.value);
    });
    el.submitButton.addEventListener("click", submitWord);
    el.wordInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitWord();
    });
    el.copyButton.addEventListener("click", copyInvite);

    const requestedRoom = new URLSearchParams(location.search).get("room");
    const saved = JSON.parse(sessionStorage.getItem("tongci-session") || "null");
    if (saved?.roomCode && saved?.playerId && (!requestedRoom || requestedRoom === saved.roomCode)) {
      enterRoom(saved.roomCode, saved.playerId);
    } else if (requestedRoom) {
      el.joinBox.classList.add("open");
      el.roomInput.value = requestedRoom.toUpperCase().slice(0, 6);
      el.roomInput.focus();
    }
  </script>
</body>
</html>
